<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit Tests — Expense &amp; Budget Visualizer</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #f9f9f9; }
    h1 { color: #333; }
    #summary { font-size: 1.2rem; font-weight: bold; margin: 1rem 0; padding: 0.75rem 1rem; border-radius: 4px; }
    #summary.pass { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    #summary.fail { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .suite { margin: 1.5rem 0; }
    .suite-title { font-size: 1.1rem; font-weight: bold; color: #444; border-bottom: 2px solid #ddd; padding-bottom: 0.25rem; margin-bottom: 0.5rem; }
    .test { padding: 0.4rem 0.75rem; margin: 0.25rem 0; border-radius: 3px; font-size: 0.95rem; }
    .test.pass { background: #d4edda; color: #155724; }
    .test.fail { background: #f8d7da; color: #721c24; }
    .test.pass::before { content: "✓ "; }
    .test.fail::before { content: "✗ "; }
    .error-detail { font-size: 0.85rem; margin-top: 0.25rem; padding: 0.25rem 0.5rem; background: #fff3cd; border-left: 3px solid #ffc107; color: #856404; }
  </style>
</head>
<body>
  <h1>Unit Tests — Expense &amp; Budget Visualizer</h1>
  <div id="summary">Running tests…</div>
  <div id="results"></div>

  <!-- =====================================================================
       Minimal DOM required by app.js
       ===================================================================== -->
  <span id="balance-display" style="display:none">$0.00</span>
  <form id="expense-form" style="display:none">
    <input type="text"   id="name-input"       value="" />
    <span  class="error" id="name-error"></span>
    <input type="number" id="amount-input"      value="" />
    <span  class="error" id="amount-error"></span>
    <select id="category-select">
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Fun">Fun</option>
    </select>
    <button type="submit">Add Expense</button>
  </form>
  <ul id="transaction-list" style="display:none"></ul>
  <div id="chart-container" style="display:none"><canvas id="spending-chart"></canvas></div>
  <div id="storage-error" role="alert" aria-live="assertive" hidden></div>

  <!-- =====================================================================
       Inline micro test framework
       ===================================================================== -->
  <script>
    /* -----------------------------------------------------------------------
       Micro test framework
       ----------------------------------------------------------------------- */
    const _suites = [];
    let _currentSuite = null;

    function describe(name, fn) {
      _currentSuite = { name, tests: [] };
      _suites.push(_currentSuite);
      fn();
      _currentSuite = null;
    }

    function it(name, fn) {
      _currentSuite.tests.push({ name, fn });
    }

    function expect(actual) {
      return {
        toBe(expected) {
          if (actual !== expected) {
            throw new Error(`Expected ${JSON.stringify(actual)} to be ${JSON.stringify(expected)}`);
          }
        },
        toEqual(expected) {
          const a = JSON.stringify(actual);
          const b = JSON.stringify(expected);
          if (a !== b) {
            throw new Error(`Expected ${a} to equal ${b}`);
          }
        },
        toBeDefined() {
          if (actual === undefined) {
            throw new Error(`Expected value to be defined, but got undefined`);
          }
        },
        toBeUndefined() {
          if (actual !== undefined) {
            throw new Error(`Expected value to be undefined, but got ${JSON.stringify(actual)}`);
          }
        },
        toHaveBeenCalled() {
          if (!actual || !actual._called) {
            throw new Error(`Expected spy to have been called`);
          }
        },
      };
    }

    /** Create a simple spy that records calls and optionally replaces a method. */
    function createSpy(obj, method, impl) {
      const original = obj ? obj[method] : null;
      const spy = function (...args) {
        spy._called = true;
        spy._calls.push(args);
        if (impl) return impl(...args);
        if (original) return original.apply(obj, args);
      };
      spy._called = false;
      spy._calls = [];
      spy._restore = () => { if (obj) obj[method] = original; };
      if (obj) obj[method] = spy;
      return spy;
    }

    async function runTests() {
      const resultsEl = document.getElementById('results');
      const summaryEl = document.getElementById('summary');
      let passed = 0, failed = 0;

      for (const suite of _suites) {
        const suiteDiv = document.createElement('div');
        suiteDiv.className = 'suite';
        const title = document.createElement('div');
        title.className = 'suite-title';
        title.textContent = suite.name;
        suiteDiv.appendChild(title);

        for (const test of suite.tests) {
          const testDiv = document.createElement('div');
          try {
            await test.fn();
            testDiv.className = 'test pass';
            testDiv.textContent = test.name;
            passed++;
          } catch (err) {
            testDiv.className = 'test fail';
            testDiv.textContent = test.name;
            const detail = document.createElement('div');
            detail.className = 'error-detail';
            detail.textContent = err.message || String(err);
            testDiv.appendChild(detail);
            failed++;
          }
          suiteDiv.appendChild(testDiv);
        }

        resultsEl.appendChild(suiteDiv);
      }

      const total = passed + failed;
      summaryEl.textContent = `${passed} / ${total} tests passed${failed > 0 ? ` — ${failed} FAILED` : ''}`;
      summaryEl.className = 'summary ' + (failed === 0 ? 'pass' : 'fail');
    }
  </script>

  <!-- =====================================================================
       Load app.js — it will self-register via DOMContentLoaded.
       We need its exported functions; since we're in a browser (no module
       system), app.js uses `if (typeof module !== 'undefined')` for exports.
       We'll access functions directly from the global scope by reading them
       after the script loads.
       ===================================================================== -->
  <script src="../js/app.js"></script>

  <!-- =====================================================================
       Test definitions
       ===================================================================== -->
  <script>
    /* ------------------------------------------------------------------
       Helpers
       ------------------------------------------------------------------ */

    /** Reset the in-memory transactions array via the exported setter. */
    function resetTransactions(arr) {
      // app.js exposes setTransactions on the module.exports object in Node,
      // but in the browser the functions are plain globals.
      // We reach into the closure via the exported helpers if available,
      // otherwise we manipulate the DOM-driven state indirectly.
      // Since app.js declares `let transactions = []` at module scope and
      // exports setTransactions, in the browser we call it directly.
      if (typeof setTransactions === 'function') {
        setTransactions(arr);
      }
    }

    function getTransactionsArr() {
      if (typeof getTransactions === 'function') {
        return getTransactions();
      }
      return [];
    }

    /** Mock localStorage for a single test, then restore. */
    function withMockStorage(overrides, fn) {
      const store = {};
      const original = {
        getItem:  localStorage.getItem.bind(localStorage),
        setItem:  localStorage.setItem.bind(localStorage),
        removeItem: localStorage.removeItem.bind(localStorage),
        clear:    localStorage.clear.bind(localStorage),
      };

      if (overrides.getItem)  localStorage.getItem  = overrides.getItem;
      if (overrides.setItem)  localStorage.setItem  = overrides.setItem;
      if (overrides.clear)    localStorage.clear    = overrides.clear;

      try {
        return fn();
      } finally {
        localStorage.getItem  = original.getItem;
        localStorage.setItem  = original.setItem;
        localStorage.clear    = original.clear;
      }
    }

    /* ------------------------------------------------------------------
       Suite 1: validateForm()
       ------------------------------------------------------------------ */
    describe('validateForm()', () => {
      it('empty name → returns name error', () => {
        const errors = validateForm({ name: '', amount: '9.99', category: 'Food' });
        expect(errors.name).toBe('Item name is required.');
        expect(errors.amount).toBeUndefined();
      });

      it('whitespace-only name ("   ") → returns name error', () => {
        const errors = validateForm({ name: '   ', amount: '9.99', category: 'Food' });
        expect(errors.name).toBe('Item name is required.');
      });

      it('amount "0" → returns amount error', () => {
        const errors = validateForm({ name: 'Coffee', amount: '0', category: 'Food' });
        expect(errors.amount).toBeDefined();
        expect(errors.name).toBeUndefined();
      });

      it('amount "-5" → returns amount error', () => {
        const errors = validateForm({ name: 'Coffee', amount: '-5', category: 'Food' });
        expect(errors.amount).toBeDefined();
      });

      it('amount "1.234" (3 decimal places) → returns amount error', () => {
        const errors = validateForm({ name: 'Coffee', amount: '1.234', category: 'Food' });
        expect(errors.amount).toBeDefined();
      });

      it('amount "abc" → returns amount error', () => {
        const errors = validateForm({ name: 'Coffee', amount: 'abc', category: 'Food' });
        expect(errors.amount).toBeDefined();
      });

      it('valid name + amount "9.99" → returns {}', () => {
        const errors = validateForm({ name: 'Coffee', amount: '9.99', category: 'Food' });
        expect(errors).toEqual({});
      });
    });

    /* ------------------------------------------------------------------
       Suite 2: formatCurrency()
       ------------------------------------------------------------------ */
    describe('formatCurrency()', () => {
      it('0 → "$0.00"', () => {
        expect(formatCurrency(0)).toBe('$0.00');
      });

      it('4.5 → "$4.50"', () => {
        expect(formatCurrency(4.5)).toBe('$4.50');
      });

      it('-10 → "-$10.00"', () => {
        expect(formatCurrency(-10)).toBe('-$10.00');
      });

      it('1234.56 → "$1,234.56"', () => {
        expect(formatCurrency(1234.56)).toBe('$1,234.56');
      });
    });

    /* ------------------------------------------------------------------
       Suite 3: loadFromStorage()
       ------------------------------------------------------------------ */
    describe('loadFromStorage()', () => {
      it('absent key → returns []', () => {
        localStorage.clear();
        const result = loadFromStorage();
        expect(result).toEqual([]);
      });

      it('valid JSON string → returns correct array', () => {
        const data = [
          { id: '1', name: 'Coffee', amount: 4.5, category: 'Food' },
          { id: '2', name: 'Bus',    amount: 2.0, category: 'Transport' },
        ];
        localStorage.setItem('transactions', JSON.stringify(data));
        const result = loadFromStorage();
        expect(result).toEqual(data);
        localStorage.clear();
      });

      it('malformed JSON → returns [] and calls console.error', () => {
        localStorage.setItem('transactions', '{not valid json}');

        // Spy on console.error
        const originalError = console.error;
        let errorCalled = false;
        console.error = function () { errorCalled = true; };

        const result = loadFromStorage();

        console.error = originalError;
        localStorage.clear();

        expect(result).toEqual([]);
        if (!errorCalled) throw new Error('Expected console.error to have been called');
      });
    });

    /* ------------------------------------------------------------------
       Suite 4: saveToStorage()
       ------------------------------------------------------------------ */
    describe('saveToStorage()', () => {
      it('normal call → returns { ok: true } and value is stored', () => {
        localStorage.clear();
        const data = [{ id: '1', name: 'Coffee', amount: 4.5, category: 'Food' }];
        const result = saveToStorage(data);
        expect(result).toEqual({ ok: true });
        const stored = localStorage.getItem('transactions');
        expect(stored).toBe(JSON.stringify(data));
        localStorage.clear();
      });

      it('mock setItem throws → returns { ok: false, error } and calls console.error', () => {
        const mockError = new Error('QuotaExceededError');
        const originalSetItem = localStorage.setItem.bind(localStorage);
        localStorage.setItem = function () { throw mockError; };

        const originalError = console.error;
        let errorCalled = false;
        console.error = function () { errorCalled = true; };

        const result = saveToStorage([{ id: '1', name: 'Test', amount: 1, category: 'Fun' }]);

        localStorage.setItem = originalSetItem;
        console.error = originalError;

        if (result.ok !== false) throw new Error(`Expected ok to be false, got ${result.ok}`);
        if (result.error !== mockError) throw new Error('Expected error to be the thrown error');
        if (!errorCalled) throw new Error('Expected console.error to have been called');
      });
    });

    /* ------------------------------------------------------------------
       Suite 5: renderBalance()
       ------------------------------------------------------------------ */
    describe('renderBalance()', () => {
      it('empty array → #balance-display shows "$0.00"', () => {
        resetTransactions([]);
        renderBalance();
        const el = document.getElementById('balance-display');
        expect(el.textContent).toBe('$0.00');
      });

      it('[{amount:4.50},{amount:2.00}] → #balance-display shows "$6.50"', () => {
        resetTransactions([
          { id: '1', name: 'Coffee', amount: 4.50, category: 'Food' },
          { id: '2', name: 'Bus',    amount: 2.00, category: 'Transport' },
        ]);
        renderBalance();
        const el = document.getElementById('balance-display');
        expect(el.textContent).toBe('$6.50');
        resetTransactions([]);
      });
    });

    /* ------------------------------------------------------------------
       Suite 6: deleteTransaction(id)
       ------------------------------------------------------------------ */
    describe('deleteTransaction(id)', () => {
      it('known ID in array → array length decreases by 1, ID no longer present', () => {
        localStorage.clear();
        const initial = [
          { id: 'aaa', name: 'Coffee', amount: 4.5,  category: 'Food' },
          { id: 'bbb', name: 'Bus',    amount: 2.0,  category: 'Transport' },
          { id: 'ccc', name: 'Movie',  amount: 12.0, category: 'Fun' },
        ];
        resetTransactions([...initial]);
        localStorage.setItem('transactions', JSON.stringify(initial));

        const beforeLength = getTransactionsArr().length;
        deleteTransaction('bbb');

        const after = getTransactionsArr();
        if (after.length !== beforeLength - 1) {
          throw new Error(`Expected length ${beforeLength - 1}, got ${after.length}`);
        }
        const found = after.find(tx => tx.id === 'bbb');
        if (found) throw new Error('Expected id "bbb" to be absent after deletion');

        resetTransactions([]);
        localStorage.clear();
      });
    });

    /* ------------------------------------------------------------------
       Run all tests after DOM is ready
       ------------------------------------------------------------------ */
    document.addEventListener('DOMContentLoaded', runTests);
  </script>
</body>
</html>
