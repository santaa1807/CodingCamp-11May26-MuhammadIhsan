<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

  <header>
    <h1>Expense &amp; Budget Visualizer</h1>
    <p>Total Balance: <span id="balance-display">$0.00</span></p>
  </header>

  <main>
    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Add Expense</h2>
      <form id="expense-form" novalidate>
        <div class="form-group">
          <label for="name-input">Item Name</label>
          <input type="text" id="name-input" name="name" maxlength="100"
                 placeholder="e.g. Coffee" autocomplete="off">
          <span class="error" id="name-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="amount-input">Amount ($)</label>
          <input type="number" id="amount-input" name="amount"
                 step="0.01" min="0.01" placeholder="0.00">
          <span class="error" id="amount-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="category-select">Category</label>
          <select id="category-select" name="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>

        <button type="submit">Add Expense</button>
      </form>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">Transactions</h2>
      <div id="list-container">
        <ul id="transaction-list" aria-label="Transaction list"></ul>
      </div>
    </section>

    <section aria-labelledby="chart-heading">
      <h2 id="chart-heading">Spending by Category</h2>
      <div id="chart-container">
        <canvas id="spending-chart" aria-label="Pie chart showing spending distribution by category" role="img"></canvas>
      </div>
    </section>
  </main>

  <div id="storage-error" role="alert" aria-live="assertive" hidden></div>

  <script src="js/app.js" defer></script>
</body>
</html>
